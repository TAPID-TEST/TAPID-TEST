<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Employer Approvals — TapID</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="dashboard-theme.css?v=20261006-reports"><link rel="stylesheet" href="university-reports.css?v=20261006-reports"></head>
<body class="university-dashboard-page report-page"><header class="shell topbar"><a class="brand" href="index.html">Tap<span>ID</span></a><div class="nav-actions"><a class="btn btn-secondary" href="university-admin.html">Administration</a><button id="logoutBtn" class="btn btn-secondary">Log Out</button></div></header>
<main class="shell university-page"><nav class="report-nav"><a href="university-dashboard.html">Career-fair reports</a><a class="active" href="university-employers.html">Employer approvals</a><a href="university-admin.html">Events &amp; cards</a></nav>
<div class="report-title"><div><div class="eyebrow" id="schoolName">University</div><h1>Employer approvals</h1></div><button id="refreshApprovals" class="btn btn-secondary">Refresh</button></div>
<div id="pageMessage" class="message" hidden></div><div class="approval-toolbar"><div class="approval-tabs" id="approvalTabs"><button data-status="pending" class="active">Pending <span id="pendingCount">0</span></button><button data-status="verified">Approved <span id="verifiedCount">0</span></button><button data-status="rejected">Declined <span id="rejectedCount">0</span></button></div><input id="approvalSearch" type="search" aria-label="Search employers" placeholder="Company, recruiter, or email"></div>
<div id="approvalList" class="approval-list" aria-live="polite"></div></main>
<dialog id="reviewDialog" class="dialog-card"><div class="section-head"><h2 id="reviewTitle">Review employer</h2><button id="closeReview" class="icon-btn" aria-label="Close">×</button></div><p id="reviewIdentity"></p><form id="reviewForm"><div class="field"><label for="reviewReason">Message to employer <span id="requiredReason"></span></label><textarea id="reviewReason" maxlength="500"></textarea></div><div id="reviewMessage" class="message" hidden></div><div class="form-actions"><button id="cancelReview" class="btn btn-secondary" type="button">Cancel</button><button id="confirmReview" class="btn btn-primary" type="submit">Confirm</button></div></form></dialog>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="app.js?v=20261006-reports"></script><script src="university-card-access.js?v=20261006-reports"></script><script src="university-employer-approvals.js?v=20261006-reports"></script></body></html>
