<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset Password — TapID</title><link rel="stylesheet" href="styles.css"></head>
<body class="auth-page">
<header class="auth-nav auth-shell"><a class="brand auth-brand" href="index.html">Tap<span>ID</span></a><a class="auth-nav-link" href="login.html">Back to login</a></header>
<main class="auth-main auth-shell"><section class="auth-panel"><div class="auth-heading"><div class="eyebrow">Account recovery</div><h1>Reset your password.</h1><p>We will email you a secure recovery link.</p></div><div id="message" class="message" hidden></div><form id="form" class="auth-form"><div class="field"><label for="email">Account email</label><input id="email" type="email" autocomplete="email" required></div><div class="form-actions auth-submit-row"><button id="button" class="btn btn-primary btn-block" type="submit">Send Recovery Link</button></div></form></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="app.js"></script><script>
const form=document.getElementById('form'),message=document.getElementById('message'),button=document.getElementById('button');
form.addEventListener('submit',async e=>{e.preventDefault();tapid.setBusy(button,true,'Sending…');tapid.setMessage(message,'');try{const email=document.getElementById('email').value.trim();const redirectTo=`${location.origin}/reset-password.html`;const {error}=await tapid.client.auth.resetPasswordForEmail(email,{redirectTo});if(error)throw error;tapid.setMessage(message,'If an account exists for that email, a recovery link has been sent.','success');}catch(err){tapid.setMessage(message,err.message,'error');}finally{tapid.setBusy(button,false);}});
</script></body></html>
