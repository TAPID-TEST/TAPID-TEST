<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Create TapID</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="auth-page">
  <header class="auth-nav auth-shell">
    <a class="brand auth-brand" href="index.html">Tap<span>ID</span></a>
    <a class="auth-nav-link" href="login.html">Log in</a>
  </header>

  <main class="auth-main auth-shell auth-main-signup">
    <section class="auth-panel auth-panel-wide" aria-labelledby="signupTitle">
      <div class="auth-heading">
        <div class="eyebrow">Get started</div>
        <h1 id="signupTitle">Create your TapID.</h1>
        <p>Your Cal Poly email handles verification. Your profile starts with you.</p>
      </div>

      <div id="message" class="message" hidden></div>

      <form id="signupForm" class="auth-form" novalidate>
        <div class="form-grid auth-name-grid">
          <div class="field">
            <label for="firstName">First name</label>
            <input id="firstName" autocomplete="given-name" placeholder="First name" required>
          </div>
          <div class="field">
            <label for="lastName">Last name</label>
            <input id="lastName" autocomplete="family-name" placeholder="Last name" required>
          </div>
        </div>

        <input id="username" type="hidden">

        <div class="field">
          <label for="email">University email</label>
          <input id="email" type="email" autocomplete="email" placeholder="you@calpoly.edu" required>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input id="password" type="password" autocomplete="new-password" minlength="8" placeholder="At least 8 characters" required>
        </div>

        <div class="form-actions auth-submit-row">
          <button id="signupBtn" class="btn btn-primary btn-block auth-primary" type="submit">Create Account</button>
        </div>
      </form>

      <p class="auth-switch">Already have a TapID? <a href="login.html">Log in</a></p>
    </section>
  </main>

  <footer class="auth-footer auth-shell">
    <a href="employer-login.html">Employer sign in</a>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="app.js?v=20261006-reports"></script>
  <script>
    const form = document.getElementById('signupForm');
    const message = document.getElementById('message');
    const button = document.getElementById('signupBtn');
    const usernameInput = document.getElementById('username');

    usernameInput.addEventListener('input', () => {
      usernameInput.value = tapid.cleanUsername(usernameInput.value);
    });

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      tapid.setMessage(message, '');

      const firstName = document.getElementById('firstName').value.trim();
      const lastName = document.getElementById('lastName').value.trim();
      const stem = tapid.cleanUsername(`${document.getElementById('firstName').value}${document.getElementById('lastName').value}`) || 'student';
      const username = `${stem.slice(0,24)}-${crypto.randomUUID().slice(0,8)}`;
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      if (!firstName || !lastName || !username || !email || password.length < 8) {
        tapid.setMessage(message, 'Complete every field and use a password of at least 8 characters.', 'error');
        return;
      }
      if (username.length < 3) {
        tapid.setMessage(message, 'Your username must be at least 3 characters.', 'error');
        return;
      }

      tapid.setBusy(button, true, 'Creating account…');
      try {
        const { data, error } = await tapid.client.auth.signUp({
          email,
          password,
          options: {
            emailRedirectTo: tapid.siteUrl('login.html?confirmed=1'),
            data: {
              username,
              first_name: firstName,
              last_name: lastName
            }
          }
        });
        if (error) throw error;

        if (!data.session) {
          tapid.setMessage(message, 'Account created. Check your email to confirm the account, then log in to continue.', 'success');
          form.reset();
          return;
        }

        window.location.replace('onboarding.html');
      } catch (error) {
        tapid.setMessage(message, tapid.friendlyAuthError(error), 'error');
      } finally {
        tapid.setBusy(button, false);
      }
    });
  </script>
</body>
</html>
