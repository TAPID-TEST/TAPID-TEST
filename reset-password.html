<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Choose New Password — TapID</title><link rel="stylesheet" href="styles.css"></head>
<body class="auth-page">
<header class="auth-nav auth-shell"><a class="brand auth-brand" href="index.html">Tap<span>ID</span></a></header>
<main class="auth-main auth-shell"><section class="auth-panel"><div class="auth-heading"><div class="eyebrow">Account recovery</div><h1>Choose a new password.</h1><p>Use at least eight characters.</p></div><div id="message" class="message" hidden></div><form id="form" class="auth-form"><div class="field"><label for="password">New password</label><input id="password" type="password" minlength="8" autocomplete="new-password" required></div><div class="field"><label for="confirm">Confirm password</label><input id="confirm" type="password" minlength="8" autocomplete="new-password" required></div><div class="form-actions auth-submit-row"><button id="button" class="btn btn-primary btn-block" type="submit">Update Password</button></div></form></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="app.js"></script><script>
const form=document.getElementById('form'),message=document.getElementById('message'),button=document.getElementById('button');
form.addEventListener('submit',async e=>{e.preventDefault();const password=document.getElementById('password').value,confirm=document.getElementById('confirm').value;if(password.length<8||password!==confirm){tapid.setMessage(message,'Passwords must match and contain at least eight characters.','error');return;}tapid.setBusy(button,true,'Updating…');try{const {error}=await tapid.client.auth.updateUser({password});if(error)throw error;tapid.setMessage(message,'Password updated. You can now return to login.','success');window.setTimeout(()=>location.replace('login.html'),1200);}catch(err){tapid.setMessage(message,err.message,'error');}finally{tapid.setBusy(button,false);}});
</script></body></html>
