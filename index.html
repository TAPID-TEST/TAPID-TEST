  <script>
    const scene = document.getElementById('assemblyScene');
    let sealTimer;
    let engravingFrame;
    const engravingPaths = [...scene.querySelectorAll('.engraving-glyph')].map(path => ({
      path, length: path.getTotalLength(),
      start: path.dataset.row === 'name-trace' ? 4550 + Number(path.dataset.index) * 190 : 7470 + Number(path.dataset.index) * 130,
      duration: path.dataset.row === 'name-trace' ? 340 : 250
    }));
    const laserContact = scene.querySelector('.contact-laser');
    function renderEngraving(started, now) {
      const elapsed = now - started;
      let active;
      engravingPaths.forEach(item => {
        const progress = Math.max(0, Math.min(1, (elapsed - item.start) / item.duration));
        item.path.style.strokeDasharray = item.length;
        item.path.style.strokeDashoffset = item.length * (1 - progress);
        item.path.style.opacity = progress > 0 ? 1 : 0;
        item.path.style.fill = progress === 1 ? '#c5aa6b' : 'none';
        if (progress > 0 && progress < 1) active = {item, progress};
      });
      laserContact.style.opacity = active ? 1 : 0;
      if (active) {
        const point = active.item.path.getPointAtLength(active.item.length * active.progress);
        laserContact.setAttribute('transform', `translate(${point.x} ${point.y})`);
        laserContact.querySelector('.contact-spark').style.opacity = Math.sin(elapsed * .17) > .55 ? .85 : .12;
      }
      if (elapsed < 10000) engravingFrame = requestAnimationFrame(now => renderEngraving(started, now));
    }
    const playAssembly = () => {
      cancelAnimationFrame(engravingFrame);
      clearTimeout(sealTimer);
      scene.classList.remove('is-playing', 'is-sealed');
      void scene.offsetWidth;
      scene.classList.add('is-playing');
      const started = performance.now();
      renderEngraving(started, started);
      sealTimer = setTimeout(() => scene.classList.add('is-sealed'), 4050);
    };
    requestAnimationFrame(playAssembly);
    setInterval(playAssembly, 17000);
    scene.addEventListener('pointermove', (event) => {
        const box = scene.getBoundingClientRect();
        const x = (event.clientX - box.left) / box.width;
        const y = (event.clientY - box.top) / box.height;
        scene.style.setProperty('--scene-rx', `${(0.5 - y) * 10}deg`);
        scene.style.setProperty('--scene-ry', `${(x - 0.5) * 14}deg`);
        scene.style.setProperty('--light-x', `${x * 100}%`);
        scene.style.setProperty('--light-y', `${y * 100}%`);
    });
    scene.addEventListener('pointerleave', () => {
      scene.style.removeProperty('--scene-rx');
      scene.style.removeProperty('--scene-ry');
    });
  </script>
