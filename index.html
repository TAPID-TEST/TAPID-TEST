  <meta name="description" content="TapID is a professional identity and networking platform built for students. Share who you are and connect anywhere with one tap.">
  <link rel="canonical" href="https://tapidcard.com/">
  <meta property="og:type" content="website">
  <meta property="og:title" content="TapID — Your professional story. One tap away.">
  <meta property="og:description" content="A digital professional identity that helps students share their story and continue career conversations.">

  <link rel="stylesheet" href="styles.css?v=20261006-login-fix1">
  <style id="landing-eight-second-timeline">
    /* Keep assembly, SVG engraving, tap, and repeat on one eight-second timeline. */
    .landing-page .assembly-scene.is-playing .layer-core{animation:assembleCore 1.55s cubic-bezier(.2,.75,.2,1) both}
    .landing-page .assembly-scene.is-playing .layer-metal{animation:assembleMetal 1.65s .1s cubic-bezier(.2,.75,.2,1) both}
    .landing-page .assembly-scene.is-playing .layer-coil{animation:assembleCoil 1.7s .15s cubic-bezier(.2,.75,.2,1) both}
    .landing-page .assembly-scene.is-playing .layer-finish{animation:assembleFinish 1.75s .2s cubic-bezier(.2,.75,.2,1) both}
    .landing-page .assembly-scene.is-playing .layer-engraving{animation:setEngraving 1.75s .25s cubic-bezier(.2,.75,.2,1) both}
    .landing-page .assembly-scene.is-playing .svg-rule{animation:traceRule .35s 3.76s linear both}
    .landing-page .assembly-scene.is-playing .engraved-nfc{animation:engraveNfc .3s 5.05s ease both}
    .landing-page .assembly-scene.is-playing .demo-phone{animation:tapidPhoneEightSeconds .6s 5.35s cubic-bezier(.2,.75,.2,1) both}
    .landing-page .assembly-scene.is-playing .tap-ripple{animation:tapPulse .7s 5.9s ease-out both}
    .landing-page .assembly-scene.is-playing .tap-notification{animation:tapidNotificationEightSeconds .3s 6.1s ease both}
    @keyframes tapidPhoneEightSeconds{from{opacity:0;transform:translate3d(170px,90px,160px) rotateY(-22deg) rotateZ(12deg) scale(.7)}to{opacity:1;transform:translate3d(0,0,135px) rotateY(-16deg) rotateZ(7deg) scale(1)}}
    @keyframes tapidNotificationEightSeconds{from{opacity:0;transform:translateY(-20px)}to{opacity:1;transform:none}}
    @media(prefers-reduced-motion:reduce){.landing-page .assembly-scene.is-playing .assembly-layer{animation-duration:.01s;animation-delay:0s}}
  </style>

  <script>
    const scene = document.getElementById('assemblyScene');
    let sealTimer;
    let engravingFrame;
    const assemblyCompleteAt = 2000;
    const engravingPaths = [...scene.querySelectorAll('.engraving-glyph')].map(path => ({
      path, length: path.getTotalLength(),
      start: path.dataset.row === 'name-trace' ? assemblyCompleteAt + Number(path.dataset.index) * 160 : 3800 + Number(path.dataset.index) * 110,
      duration: path.dataset.row === 'name-trace' ? 160 : 110
    }));
    const laserContact = scene.querySelector('.contact-laser');
    function renderEngraving(started, now) {
      const elapsed = now - started;
      let active;
      engravingPaths.forEach(item => {
        const progress = Math.max(0, Math.min(1, (elapsed - item.start) / item.duration));
        item.path.style.strokeDasharray = item.length;
        item.path.style.strokeDashoffset = item.length * (1 - progress);
        item.path.style.opacity = progress > 0 ? 1 : 0;
        item.path.style.fill = progress === 1 ? '#c5aa6b' : 'none';
        if (progress > 0 && progress < 1) active = {item, progress};
      });
      laserContact.style.opacity = active ? 1 : 0;
      if (active) {
        const point = active.item.path.getPointAtLength(active.item.length * active.progress);
        laserContact.setAttribute('transform', `translate(${point.x} ${point.y})`);
        laserContact.querySelector('.contact-spark').style.opacity = Math.sin(elapsed * .17) > .55 ? .85 : .12;
      }
      if (elapsed < 5300) engravingFrame = requestAnimationFrame(now => renderEngraving(started, now));
    }
    const playAssembly = () => {
      cancelAnimationFrame(engravingFrame);
      clearTimeout(sealTimer);
      scene.classList.remove('is-playing', 'is-sealed');
      void scene.offsetWidth;
      scene.classList.add('is-playing');
      const started = performance.now();
      renderEngraving(started, started);
      sealTimer = setTimeout(() => scene.classList.add('is-sealed'), assemblyCompleteAt);
    };
    requestAnimationFrame(playAssembly);
    setInterval(playAssembly, 8000);
    scene.addEventListener('pointermove', (event) => {
        const box = scene.getBoundingClientRect();
        const x = (event.clientX - box.left) / box.width;
        const y = (event.clientY - box.top) / box.height;
        scene.style.setProperty('--scene-rx', `${(0.5 - y) * 10}deg`);
        scene.style.setProperty('--scene-ry', `${(x - 0.5) * 14}deg`);
        scene.style.setProperty('--light-x', `${x * 100}%`);
        scene.style.setProperty('--light-y', `${y * 100}%`);
    });
    scene.addEventListener('pointerleave', () => {
      scene.style.removeProperty('--scene-rx');
      scene.style.removeProperty('--scene-ry');
    });
  </script>
