<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>TapID — One tap. Limitless potential.</title>
  <meta name="description" content="TapID is a professional identity and networking platform built for students. Share who you are and connect anywhere with one tap.">
  <link rel="canonical" href="https://tapidcard.com/">
  <meta property="og:type" content="website">
  <meta property="og:title" content="TapID — Your professional story. One tap away.">
  <meta property="og:description" content="A digital professional identity that helps students share their story and continue career conversations.">
  <meta property="og:url" content="https://tapidcard.com/">
  <meta name="theme-color" content="#073f31">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="landing-page">
  <header class="landing-nav shell">
    <a class="brand landing-brand" href="index.html" aria-label="TapID home">Tap<span>ID</span></a>
  </header>

  <main class="landing-main landing-split shell">
    <section class="landing-story" aria-labelledby="landing-title">
      <h1 id="landing-title">Your résumé shows what you’ve done.<br><em>TapID shows who you are.</em></h1>
      <div class="landing-actions"><a class="landing-primary" href="login.html">Get Started <span aria-hidden="true">→</span></a></div>
    </section>

    <section class="landing-card-stage assembly-stage" aria-label="TapID card assembling and engraving">
      <div class="assembly-scene" id="assemblyScene">
        <div class="assembly-shadow" aria-hidden="true"></div>
        <div class="assembly-layer layer-core" aria-hidden="true"></div>
        <div class="assembly-layer layer-metal" aria-hidden="true"></div>
        <div class="assembly-layer layer-coil" aria-hidden="true"><span class="coil-loop coil-one"></span><span class="coil-loop coil-two"></span><span class="coil-loop coil-three"></span><span class="coil-chip"></span></div>
        <div class="assembly-layer layer-finish" aria-hidden="true"></div>
        <div class="assembly-layer layer-engraving" aria-hidden="true">
          <svg class="engraving-svg" viewBox="0 0 720 220" role="img" aria-label="Ethan Dierke, Engineering">
            <text class="svg-name" x="10" y="78">Ethan Dierke</text>
            <path class="svg-rule" d="M10 104 H455 L482 84 H680"/>
            <text class="svg-major" x="12" y="158">ENGINEERING</text>
            <circle class="svg-laser-point" r="7" cx="10" cy="69"/>
          </svg>
          <div class="engraved-nfc"><i></i><i></i><i></i></div>
          <span class="laser-spark spark-a"></span><span class="laser-spark spark-b"></span><span class="laser-spark spark-c"></span>
        </div>
        <span class="assembly-light" aria-hidden="true"></span>
        <span class="tap-ripple" aria-hidden="true"></span>
        <div class="demo-phone" aria-hidden="true">
          <div class="demo-phone-screen">
            <span class="demo-phone-island"></span>
            <div class="tap-notification"><b>T</b><span><strong>TapID opened</strong><small>Professional profile ready</small></span></div>
          </div>
        </div>
      </div>
      <button class="sound-toggle" id="soundToggle" type="button" aria-label="Enable animation sound">♪</button>
    </section>
  </main>

  <footer class="landing-footer shell">
    <div class="landing-trust">
      <span class="landing-shield" aria-hidden="true">✓</span>
      <span>Your work, presented with context.</span>
    </div>
    <span class="landing-employer-link">Students · Employers · Universities</span>
  </footer>
  <script>
    const scene = document.getElementById('assemblyScene');
    const soundToggle = document.getElementById('soundToggle');
    let soundOn = false;
    let audioContext;
    let soundTimers = [];
    const tone = (frequency, duration, delay = 0, volume = .05) => {
      if (!soundOn || !audioContext) return;
      const timer = setTimeout(() => {
        const oscillator = audioContext.createOscillator();
        const gain = audioContext.createGain();
        const now = audioContext.currentTime;
        oscillator.type = 'sine';
        oscillator.frequency.setValueAtTime(frequency, now);
        gain.gain.setValueAtTime(.0001, now);
        gain.gain.exponentialRampToValueAtTime(volume, now + .02);
        gain.gain.exponentialRampToValueAtTime(.0001, now + duration);
        oscillator.connect(gain); gain.connect(audioContext.destination);
        oscillator.start(now); oscillator.stop(now + duration + .04);
      }, delay);
      soundTimers.push(timer);
    };
    const engravingSound = (delay = 0, duration = 3.8) => {
      if (!soundOn || !audioContext) return;
      const timer = setTimeout(() => {
        const length = Math.floor(audioContext.sampleRate * duration);
        const buffer = audioContext.createBuffer(1, length, audioContext.sampleRate);
        const channel = buffer.getChannelData(0);
        for (let i = 0; i < length; i++) channel[i] = (Math.random() * 2 - 1) * (0.28 + 0.12 * Math.sin(i / 37));
        const source = audioContext.createBufferSource();
        const filter = audioContext.createBiquadFilter();
        const gain = audioContext.createGain();
        filter.type = 'bandpass'; filter.frequency.value = 1450; filter.Q.value = 2.4;
        gain.gain.setValueAtTime(.0001, audioContext.currentTime);
        gain.gain.exponentialRampToValueAtTime(.035, audioContext.currentTime + .08);
        gain.gain.exponentialRampToValueAtTime(.0001, audioContext.currentTime + duration);
        source.buffer = buffer; source.connect(filter); filter.connect(gain); gain.connect(audioContext.destination); source.start();
      }, delay);
      soundTimers.push(timer);
    };
    const scheduleSound = () => {
      soundTimers.forEach(clearTimeout); soundTimers = [];
      tone(110, .5, 450, .025); tone(170, .35, 2650, .035);
      engravingSound(4900, 3.9);
      tone(1050, .09, 10800, .07); tone(1480, .2, 10910, .065);
    };
    const playAssembly = () => {
      scene.classList.remove('is-playing');
      void scene.offsetWidth;
      scene.classList.add('is-playing');
      scheduleSound();
    };
    requestAnimationFrame(playAssembly);
    setInterval(playAssembly, 17000);
    soundToggle.addEventListener('click', async () => {
      if (!audioContext) audioContext = new AudioContext();
      await audioContext.resume();
      soundOn = !soundOn;
      soundToggle.classList.toggle('is-on', soundOn);
      soundToggle.textContent = soundOn ? '♫' : '♪';
      if (soundOn) scheduleSound(); else { soundTimers.forEach(clearTimeout); soundTimers = []; }
    });
    scene.addEventListener('pointermove', (event) => {
        const box = scene.getBoundingClientRect();
        const x = (event.clientX - box.left) / box.width;
        const y = (event.clientY - box.top) / box.height;
        scene.style.setProperty('--scene-rx', `${(0.5 - y) * 10}deg`);
        scene.style.setProperty('--scene-ry', `${(x - 0.5) * 14}deg`);
        scene.style.setProperty('--light-x', `${x * 100}%`);
        scene.style.setProperty('--light-y', `${y * 100}%`);
    });
    scene.addEventListener('pointerleave', () => {
      scene.style.removeProperty('--scene-rx');
      scene.style.removeProperty('--scene-ry');
    });
  </script>
</body>
</html>
