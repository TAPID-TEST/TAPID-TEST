<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>TapID — One tap. Limitless potential.</title>
  <meta name="description" content="TapID is a professional identity and networking platform built for students. Share who you are and connect anywhere with one tap.">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="landing-page">
  <header class="landing-nav shell">
    <a class="brand landing-brand" href="index.html" aria-label="TapID home">Tap<span>ID</span></a>
    <a class="landing-login" href="login.html">Log In</a>
  </header>

  <main class="landing-main shell">
    <section class="landing-copy" aria-labelledby="landing-title">
      <h1 id="landing-title">One tap.<br>Limitless potential.</h1>
      <p>TapID is your professional identity and networking platform. Share who you are. Connect anywhere.</p>
      <div class="landing-actions">
        <a class="landing-primary" href="signup.html">Get Started</a>
      </div>
    </section>

    <section class="landing-visual" aria-label="TapID NFC card">
      <div class="landing-nfc-card">
        <div class="landing-card-brand">Tap<span>ID</span></div>
        <div class="landing-nfc-center" aria-hidden="true">
          <div class="landing-rings"></div>
          <svg class="landing-nfc-icon" viewBox="0 0 80 80" role="img" aria-label="NFC tap symbol">
            <path d="M28 30c7 6 7 14 0 20" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round"/>
            <path d="M41 21c13 11 13 27 0 38" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round"/>
            <path d="M54 12c19 16 19 40 0 56" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round"/>
          </svg>
        </div>
      </div>
    </section>
  </main>

  <footer class="landing-footer shell">
    <div class="landing-trust">
      <span class="landing-shield" aria-hidden="true">✓</span>
      <span>Secure. Private. Student-focused.</span>
    </div>
    <a class="landing-employer-link" href="employer-login.html">Employer sign in</a>
  </footer>
</body>
</html>
