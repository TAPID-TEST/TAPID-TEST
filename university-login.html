<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>University Sign In — TapID</title><link rel="stylesheet" href="styles.css"></head>
<body class="auth-page university-auth-page">
<header class="shell topbar auth-topbar"><a class="brand" href="index.html">Tap<span>ID</span></a><div class="nav-actions"><a class="btn btn-secondary" href="index.html">Back Home</a></div></header>
<main class="auth-stage"><section class="auth-card university-auth-card"><div class="eyebrow">University access</div><h1>Career Services</h1><p class="auth-intro">Sign in to view aggregate professional engagement across your university.</p><form id="loginForm"><div class="field"><label for="email">University email</label><input id="email" type="email" autocomplete="email" required placeholder="career@university.edu"></div><div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required></div><div id="message" class="message" hidden></div><button id="loginBtn" class="btn btn-primary auth-submit" type="submit">Sign In</button></form><p class="auth-switch"><a href="forgot-password.html">Forgot your password?</a></p><p class="auth-footnote">University access is approved by TapID. There is no public administrator signup.</p></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="app.js"></script><script>
const form=document.getElementById('loginForm'),btn=document.getElementById('loginBtn'),msg=document.getElementById('message');
form.addEventListener('submit',async e=>{e.preventDefault();tapid.setMessage(msg,'');tapid.setBusy(btn,true,'Signing in…');try{const {data,error}=await tapid.client.auth.signInWithPassword({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value});if(error)throw error;const r=await tapid.client.from('university_admins').select('user_id,verification_status').eq('user_id',data.user.id).maybeSingle();if(r.error)throw r.error;if(!r.data||r.data.verification_status!=='verified'){await tapid.client.auth.signOut();throw new Error(r.data?'This university account is awaiting TapID approval.':'This account does not have university administrator access.');}location.replace('university-dashboard.html');}catch(err){tapid.setMessage(msg,err.message||'Could not sign in.','error');}finally{tapid.setBusy(btn,false);}});
(async()=>{if(new URLSearchParams(location.search).get('status')==='pending')tapid.setMessage(msg,'This university account is awaiting TapID approval.','error');const u=await tapid.getUser();if(!u)return;const r=await tapid.client.from('university_admins').select('user_id,verification_status').eq('user_id',u.id).maybeSingle();if(r.data?.verification_status==='verified')location.replace('university-dashboard.html');})();
</script></body></html>
